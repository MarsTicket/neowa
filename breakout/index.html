<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>벽돌깨기 - 너와 아케이드</title>
<meta name="description" content="3D 벽돌깨기. 마우스, 터치, 방향키로 패들을 움직이세요.">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T386KYRRLK"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){window.dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-T386KYRRLK');
</script>
<script src="../assets/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0c14;color:#f2f3f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:860px;margin:0 auto;padding:20px 24px 40px}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 16px;border-bottom:1px solid #232744;margin-bottom:16px}
.top h1{font-size:28px;margin:0;letter-spacing:-0.5px}
.top .eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:#ffb020;margin:0 0 4px}
.back{display:inline-block;padding:10px 16px;border:1px solid #3a4066;border-radius:999px;font-size:14px;font-weight:700;min-height:44px;line-height:22px;color:#c8cdea}
.hud{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:560px){.hud{grid-template-columns:1fr 1fr}}
.stat{background:#161a30;border:1px solid #2a2f52;border-radius:14px;padding:10px 14px}
.stat .label{display:block;font-size:12px;color:#9aa1c2;margin-bottom:2px}
.stat .value{font-size:22px;font-weight:900;line-height:1.2}
.stat.score .value{font-size:28px;color:#ffb020}
canvas{display:block;width:100%;height:auto;background:#050816;border:1px solid #2a2f52;border-radius:20px;touch-action:none;box-shadow:0 20px 50px rgba(0,0,0,0.45)}
.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:13px 22px;font-size:15px;font-weight:800;min-height:48px;cursor:pointer}
button.primary{background:#fff;color:#0a0c14}
button.accent{background:#3182f6;color:#fff}
button.secondary{background:transparent;color:#f2f3f7;border:1px solid #3a4066}
p{color:#9aa1c2;line-height:1.6;font-size:14px}
.msg{font-weight:800;min-height:24px;margin-top:14px;color:#c8cdea}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div>
<p class="eyebrow">BREAKOUT</p>
<h1>벽돌깨기</h1>
</div>
<a class="back" href="../">허브로 돌아가기</a>
</div>
<div class="hud">
<div class="stat score"><span class="label">점수</span><span class="value" id="score">0</span></div>
<div class="stat"><span class="label">목숨</span><span class="value" id="lives">3</span></div>
<div class="stat"><span class="label">레벨</span><span class="value" id="level">1</span></div>
<div class="stat"><span class="label">최고기록</span><span class="value" id="best">0</span></div>
</div>
<canvas id="game" width="720" height="480"></canvas>
<div class="msg" id="msg">시작 버튼을 누른 뒤, 공 발사 버튼을 누르세요. 마우스나 터치 드래그, 방향키로 패들을 움직입니다.</div>
<div class="controls">
<button id="startBtn" class="primary">게임 시작</button>
<button id="launchBtn" class="accent">공 발사</button>
<button id="pauseBtn" class="secondary">일시정지</button>
<button id="soundBtn" class="secondary">소리 끄기</button>
</div>
<p>드래그로 패들을 움직이세요. 벽돌을 모두 깨면 다음 레벨로 갑니다. 레벨 5까지 깨면 클리어입니다.</p>
</div>
<script>
"use strict";
var canvas = document.getElementById("game");
var scoreEl = document.getElementById("score");
var livesEl = document.getElementById("lives");
var levelEl = document.getElementById("level");
var bestEl = document.getElementById("best");
var msgEl = document.getElementById("msg");
var BEST_KEY = "neowa_hub_breakout_high";
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) { best = 0; }
bestEl.textContent = best;
if (typeof THREE === "undefined") {
  msgEl.textContent = "3D 엔진 로딩에 실패했습니다. 페이지를 새로고침하세요.";
}
var soundOn = true;
var sounds = {};
["bounce", "click", "hit", "gameover", "powerup"].forEach(function (n) {
  var a = new Audio("../assets/sounds/" + n + ".wav");
  a.preload = "auto";
  sounds[n] = a;
});
function playSound(n) {
  if (!soundOn) return;
  try {
    var a = sounds[n];
    if (!a) return;
    a.currentTime = 0;
    a.play().catch(function () {});
  } catch (e) {}
}
document.getElementById("soundBtn").addEventListener("click", function (ev) {
  soundOn = !soundOn;
  ev.target.textContent = soundOn ? "소리 끄기" : "소리 켜기";
});
var W = 28, H = 20;
var scene = null, camera = null, renderer = null;
var paddleMesh = null, ballMesh = null;
var brickGeo = null, particleGeo = null;
var particles = [];
function init3D() {
  if (typeof THREE === "undefined") return false;
  if (renderer) return true;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050816);
  camera = new THREE.PerspectiveCamera(50, 720 / 480, 0.1, 100);
  camera.position.set(0, 22, 14);
  camera.lookAt(0, 0, 0);
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(720, 480, false);
  } catch (e) {
    renderer = null;
    return false;
  }
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  var dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(5, 10, 5);
  scene.add(dir);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(34, 26), new THREE.MeshStandardMaterial({ color: 0x0a0e24, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1;
  scene.add(ground);
  brickGeo = new THREE.BoxGeometry(2.6, 0.6, 0.9);
  particleGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
  paddleMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 0.6, 0.8), new THREE.MeshStandardMaterial({ color: 0x4dd2ff, emissive: 0x1a6a8a, emissiveIntensity: 0.6, roughness: 0.3 }));
  scene.add(paddleMesh);
  ballMesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.8, roughness: 0.2 }));
  scene.add(ballMesh);
  return true;
}
function to3D(x, y) { return { x: x - W / 2, z: y - H / 2 }; }
function spawnBurst(x, y, color) {
  for (var i = 0; i < 12; i++) {
    var m = new THREE.Mesh(particleGeo, new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.8 }));
    var q = to3D(x, y);
    m.position.set(q.x, 0, q.z);
    scene.add(m);
    particles.push({ mesh: m, vx: (Math.random() - 0.5) * 8, vz: (Math.random() - 0.5) * 8, life: 0.6 });
  }
}
function updateParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.life -= dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.position.y += 0.5 * dt;
    p.mesh.rotation.x += dt * 5;
    if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
  }
}
var state = "ready";
var score = 0, lives = 3, level = 1;
var paddle = { x: 14, speed: 16 };
var ball = { x: 14, y: 16, vx: 0, vy: 0, stuck: true };
var bricks = [];
var keys = {};
var lastTime = 0;
var COLORS = [0xff5a5a, 0xffb020, 0x7ee787, 0x4dd2ff, 0xaa7eff];
function buildLevel(lv) {
  bricks.forEach(function (b) { if (scene) scene.remove(b.mesh); });
  bricks = [];
  var rows = 3 + Math.min(lv - 1, 2);
  var cols = 9;
  var spacing = 3.0;
  var startX = (W - (cols - 1) * spacing) / 2;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var col = COLORS[r % COLORS.length];
      var mesh = new THREE.Mesh(brickGeo, new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.4, roughness: 0.3 }));
      if (scene) scene.add(mesh);
      var bx = startX + c * spacing, by = 2 + r * 1.4;
      var q = to3D(bx, by);
      mesh.position.set(q.x, 0, q.z);
      bricks.push({ x: bx, y: by, color: col, mesh: mesh });
    }
  }
  ball.stuck = true;
  ball.x = paddle.x; ball.y = 16;
}
function resetGame() {
  score = 0; lives = 3; level = 1;
  paddle.x = 14;
  buildLevel(level);
  updateHud();
}
function updateHud() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  levelEl.textContent = level;
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  bestEl.textContent = best;
}
function syncMeshes() {
  if (!renderer) return;
  var p = to3D(paddle.x, 18.5);
  paddleMesh.position.set(p.x, 0, p.z);
  var b = to3D(ball.x, ball.y);
  ballMesh.position.set(b.x, 0, b.z);
}
function launch() {
  if (state !== "playing" || !ball.stuck) return;
  ball.stuck = false;
  ball.vx = (Math.random() < 0.5 ? -1 : 1) * 6;
  ball.vy = -9;
  playSound("bounce");
}
function loseLife() {
  lives -= 1;
  updateHud();
  if (lives <= 0) {
    state = "over";
    playSound("gameover");
    msgEl.textContent = "게임 오버! 점수 " + score + "점, 최고기록 " + best + "점. 시작 버튼을 눌러 다시 플레이하세요.";
  } else {
    ball.stuck = true;
    ball.x = paddle.x; ball.y = 16;
    msgEl.textContent = "공을 놓쳤습니다. 남은 목숨 " + lives + "개. 공 발사 버튼을 누르세요.";
  }
}
function startGame() {
  if (!init3D()) { msgEl.textContent = "3D 엔진 로딩에 실패했습니다. 페이지를 새로고침하세요."; return; }
  playSound("click");
  resetGame();
  state = "playing";
  msgEl.textContent = "레벨 " + level + " 시작! 공 발사 버튼을 누르세요.";
  lastTime = performance.now();
  requestAnimationFrame(loop);
}
function loop(now) {
  if (state !== "playing") return;
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (keys.ArrowLeft || keys.a) paddle.x -= paddle.speed * dt;
  if (keys.ArrowRight || keys.d) paddle.x += paddle.speed * dt;
  paddle.x = Math.max(2, Math.min(W - 2, paddle.x));
  if (ball.stuck) {
    ball.x = paddle.x; ball.y = 16;
  } else {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.x < 0.5 || ball.x > W - 0.5) { ball.vx *= -1; ball.x = Math.max(0.5, Math.min(W - 0.5, ball.x)); playSound("bounce"); }
    if (ball.y < 0.5) { ball.vy *= -1; ball.y = 0.5; playSound("bounce"); }
    if (ball.y > 18.5 && ball.vy > 0 && Math.abs(ball.x - paddle.x) < 2.2) {
      ball.vy *= -1;
      ball.vx += (ball.x - paddle.x) * 0.8;
      if (ball.vx > 12) ball.vx = 12;
      if (ball.vx < -12) ball.vx = -12;
      ball.y = 18.5;
      playSound("bounce");
    }
    if (ball.y > H) { loseLife(); }
    for (var i = bricks.length - 1; i >= 0; i--) {
      var br = bricks[i];
      if (Math.abs(ball.x - br.x) < 1.6 && Math.abs(ball.y - br.y) < 0.9) {
        spawnBurst(br.x, br.y, br.color);
        scene.remove(br.mesh);
        bricks.splice(i, 1);
        score += 100;
        ball.vy *= -1;
        playSound("hit");
        break;
      }
    }
    if (state === "playing" && bricks.length === 0) {
      score += 1000;
      updateHud();
      if (level >= 5) {
        state = "clear";
        playSound("powerup");
        msgEl.textContent = "클리어! 모든 레벨을 깨셨습니다. 점수 " + score + "점.";
      } else {
        level += 1;
        playSound("powerup");
        buildLevel(level);
        msgEl.textContent = "레벨 " + level + " 시작! 공 발사 버튼을 누르세요.";
      }
    }
  }
  updateHud();
  syncMeshes();
  updateParticles(dt);
  if (renderer) renderer.render(scene, camera);
  if (state === "playing") requestAnimationFrame(loop);
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("launchBtn").addEventListener("click", launch);
document.getElementById("pauseBtn").addEventListener("click", function () {
  if (state === "playing") { state = "paused"; msgEl.textContent = "일시정지했습니다. 일시정지 버튼을 다시 누르면 이어서 플레이합니다."; }
  else if (state === "paused") { state = "playing"; lastTime = performance.now(); requestAnimationFrame(loop); msgEl.textContent = ""; }
});
window.addEventListener("keydown", function (ev) {
  if (["ArrowLeft", "ArrowRight", " "].indexOf(ev.key) >= 0) ev.preventDefault();
  keys[ev.key] = true;
  if (ev.key === " " && state === "playing") launch();
  if (ev.key === "Enter" && (state === "ready" || state === "over" || state === "clear")) startGame();
});
window.addEventListener("keyup", function (ev) { keys[ev.key] = false; });
function canvasPos(ev) {
  var r = canvas.getBoundingClientRect();
  var touch = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
  return { x: (touch.clientX - r.left) / r.width * W, y: (touch.clientY - r.top) / r.height * H };
}
canvas.addEventListener("mousemove", function (ev) {
  var p = canvasPos(ev);
  paddle.x = Math.max(2, Math.min(W - 2, p.x));
});
canvas.addEventListener("touchstart", function (ev) {
  ev.preventDefault();
  var p = canvasPos(ev);
  paddle.x = Math.max(2, Math.min(W - 2, p.x));
  if (state === "ready") startGame();
}, { passive: false });
canvas.addEventListener("touchmove", function (ev) {
  ev.preventDefault();
  var p = canvasPos(ev);
  paddle.x = Math.max(2, Math.min(W - 2, p.x));
}, { passive: false });
if (typeof THREE !== "undefined") {
  if (init3D()) {
    resetGame();
    state = "ready";
    syncMeshes();
    renderer.render(scene, camera);
  } else {
    msgEl.textContent = "WebGL을 사용할 수 없어 3D 게임을 실행할 수 없습니다. 브라우저에서 WebGL을 켜고 페이지를 새로고침하세요.";
    updateHud();
  }
} else {
  updateHud();
}
</script>
</body>
</html>
