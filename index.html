<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>방과 후, 너와</title>
<meta name="description" content="선택지 분기형 비주얼노벨 웹게임. 전학 첫 학기, 방과 후의 선택이 이야기를 바꿉니다.">
<link rel="stylesheet" href="assets/style.css">
<script>
/* 광고와 통계 설정: 코드가 비어 있으면 해당 기능은 동작하지 않습니다. */
window.NEOWA_CONFIG = {
  gaId: 'G-T386KYRRLK',
  adfit: { title: '', chapter: '', ending: '' }
};
(function () {
  var id = window.NEOWA_CONFIG.gaId;
  if (!id) return;
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', id);
})();
</script>
</head>
<body>
<div id="app">
  <!-- 타이틀 -->
  <section id="titleScreen" class="screen">
    <img class="titleArt" src="assets/images/title_key.webp" alt="방과 후, 너와 대표 이미지">
    <div class="titleShade"></div>
    <div class="titleBox">
      <h1>방과 후, 너와</h1>
      <p class="tagline">전학 첫 학기. 방과 후의 선택이, 그녀들과의 거리를 바꿉니다.</p>
      <label class="nameLabel">주인공 이름
        <input id="nameInput" type="text" maxlength="10" placeholder="김도현">
      </label>
      <button id="newGameBtn" class="mainBtn">새 게임</button>
      <button id="continueBtn" class="subBtn">이어하기</button>
      <button id="galleryBtn" class="subBtn">갤러리</button>
      <p class="notice">15세 이용가 수준의 학원 드라마입니다. 플레이 시간 약 40분에서 60분, 엔딩 7개.</p>
      <div id="adTitle" class="adSlot hidden"></div>
    </div>
  </section>

  <!-- 게임 -->
  <section id="gameScreen" class="screen hidden">
    <img id="bgImg" class="bgImg" alt="">
    <img id="cgImg" class="cgImg hidden" alt="">
    <img id="charImg" class="charImg hidden" alt="">
    <div id="choiceBox" class="choiceBox hidden"></div>
    <div class="topBar">
      <button id="saveBtn">저장</button>
      <button id="loadBtn">불러오기</button>
      <button id="backlogBtn">백로그</button>
      <button id="autoBtn" data-on="0">자동</button>
      <button id="skipBtn" data-on="0">스킵</button>
      <button id="galBtn2">갤러리</button>
    </div>
    <div id="dialogueBox" class="dialogueBox">
      <div id="speakerName" class="speakerName"></div>
      <p id="textBody" class="textBody"></p>
      <div class="nextMark">▼</div>
    </div>
    <div id="chapterAdPanel" class="chapterAdPanel hidden">
      <p id="chapterLabel" class="chapterLabel"></p>
      <div id="adChapter" class="adSlot"></div>
      <button id="chapterContinueBtn" class="mainBtn">계속</button>
    </div>
    <div id="backlogPanel" class="backlogPanel hidden">
      <div class="backlogHead"><span>백로그</span><button id="backlogCloseBtn">닫기</button></div>
      <div id="backlogList" class="backlogList"></div>
    </div>
  </section>

  <!-- 갤러리 -->
  <section id="galleryScreen" class="screen hidden">
    <h2>갤러리</h2>
    <div id="galleryGrid" class="galleryGrid"></div>
    <p id="endingList" class="endingList"></p>
    <button id="galleryBackBtn" class="subBtn">돌아가기</button>
  </section>

  <!-- 엔딩 -->
  <section id="endingScreen" class="screen hidden">
    <div class="endingBox">
      <p class="endingLabel">ENDING</p>
      <h2 id="endingTitle"></h2>
      <p id="endingAff" class="endingAff"></p>
      <div id="adEnding" class="adSlot hidden"></div>
      <button id="restartBtn" class="mainBtn">처음부터 다시</button>
      <button id="endingGalleryBtn" class="subBtn">갤러리 보기</button>
      <button id="endingTitleBtn" class="subBtn">타이틀로</button>
    </div>
  </section>
</div>
<script src="assets/scenario.js"></script>
<script src="assets/engine.js"></script>
</body>
</html>
