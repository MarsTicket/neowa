<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="너와 아케이드 게임별 전체·주간 랭킹. 내 닉네임이 몇 위인지 확인해 보세요.">

<style>
:root{--bg:#05060c;--card:#0e1020;--ink:#f4f5fb;--sub:#aab0d4;--mute:#6f7699;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);--c:#ffd166;
  --f-display:"Black Han Sans","Pretendard Variable",Pretendard,system-ui,sans-serif;--f-body:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;--f-num:"Chakra Petch","Pretendard Variable",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:420px;pointer-events:none;background:radial-gradient(60% 100% at 50% 0%,rgba(255,209,102,.16),transparent 70%);z-index:-1}
a{color:inherit;text-decoration:none}
.wrap{max-width:860px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right)) 60px max(18px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;height:68px}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px 0 8px;border-radius:12px;color:var(--sub);font-weight:700;font-size:14px}
.back:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.back svg{width:20px;height:20px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,8vw,64px);margin:10px 0 6px;letter-spacing:1px;text-shadow:0 0 30px rgba(255,209,102,.4)}
.lead{color:var(--sub);margin:0 0 22px}
.picker{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.picker button{flex:none;font:inherit;font-size:14px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;min-height:42px;padding:0 14px;cursor:pointer;white-space:nowrap}
.picker button.on{background:var(--c);color:#05060c;border-color:var(--c)}
.cats{display:flex;gap:6px;margin:0 0 6px;flex-wrap:wrap}
.cats button{font:inherit;font-size:12px;color:var(--mute);background:none;border:0;padding:6px 8px;cursor:pointer;border-radius:8px}
.cats button.on{color:var(--ink);background:rgba(255,255,255,.06)}
.board{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:8px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bhead h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--c)}
.period{display:flex;background:rgba(255,255,255,.05);border-radius:12px;padding:3px}
.period button{font:inherit;font-weight:700;font-size:14px;color:var(--sub);background:none;border:0;border-radius:10px;min-height:38px;padding:0 16px;cursor:pointer}
.period button.on{background:var(--ink);color:#05060c}
ol{list-style:none;margin:0;padding:6px 0}
li{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;padding:10px 20px;font-size:15px}
li:nth-child(even){background:rgba(255,255,255,.025)}
li .rk{font-family:var(--f-num);font-weight:700;color:var(--mute);text-align:center}
li:nth-child(1) .rk{color:#ffd166;font-size:20px}li:nth-child(2) .rk{color:#d9e1ff;font-size:18px}li:nth-child(3) .rk{color:#ffb08a;font-size:17px}
li .sc{font-family:var(--f-num);font-weight:700;font-size:17px}
li.me{background:rgba(255,209,102,.14)!important;font-weight:700}
.state{padding:40px 20px;text-align:center;color:var(--sub)}
.cta{display:flex;gap:10px;justify-content:center;padding:16px 20px 22px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:14px;font-weight:800;background:var(--c);color:#05060c}
.note{color:var(--mute);font-size:13px;line-height:1.7;margin-top:22px}
.note a{color:var(--sub);text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>아케이드</a>
  </header>
  <h1>랭킹</h1>
  <p class="lead">게임을 끝내고 닉네임을 등록하면 여기에 올라옵니다. 이름마다 가장 좋은 점수 하나만 보여 줘요.</p>
  <div class="cats" id="cats"></div>
  <div class="picker" id="picker" role="tablist" aria-label="게임 고르기"></div>
  <section class="board">
    <div class="bhead">
      <h2 id="gname">게임</h2>
      <div class="period" role="group" aria-label="기간">
        <button class="on" data-p="all">전체</button><button data-p="week">이번 주</button>
      </div>
    </div>
    <div id="list"><p class="state">불러오는 중…</p></div>
    <div class="cta"><a class="btn" id="play" href="../">이 게임 하러 가기 →</a></div>
  </section>
  <p class="note">닉네임과 점수, 등록 시각만 저장합니다. 부적절한 닉네임은 예고 없이 지울 수 있어요. <a href="../privacy.html">개인정보처리방침</a></p>
</div>
<script src="../assets/arcade/games.js?v=1"></script>
<script src="../assets/arcade/config.js?v=1"></script>
<script>
(function () {
  'use strict';
  var G = window.NEOWA_GAMES || [], C = window.NEOWA_RANK || {}, on = !!(C.url && C.key);
  var m = /[?&]g=([a-z0-9_]+)/.exec(location.search), game = (m && m[1]) || (localStorage.getItem('neowa_last') || (G[0] && G[0].id));
  if (!G.some(function (g) { return g.id === game; })) game = G[0].id;
  var period = 'all', cat = 'all', me = '';
  try { me = localStorage.getItem('neowa_nick') || ''; } catch (e) {}
  function fmt(n) { return Math.floor(n).toLocaleString('ko-KR'); }
  function info(id) { for (var i = 0; i < G.length; i++) if (G[i].id === id) return G[i]; }
  var cats = ['all'].concat(G.map(function (g) { return g.cat; }).filter(function (c, i, a) { return a.indexOf(c) === i; }));
  var catBox = document.getElementById('cats');
  cats.forEach(function (c) { var b = document.createElement('button'); b.textContent = c === 'all' ? '전체' : c; b.dataset.c = c; if (c === cat) b.className = 'on'; b.onclick = function () { cat = c; drawCats(); drawPicker(); }; catBox.appendChild(b); });
  function drawCats() { catBox.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.c === cat); }); }
  function drawPicker() {
    var p = document.getElementById('picker'); p.innerHTML = '';
    G.filter(function (g) { return cat === 'all' || g.cat === cat; }).forEach(function (g) {
      var b = document.createElement('button'); b.textContent = g.name; b.setAttribute('role', 'tab');
      if (g.id === game) { b.className = 'on'; b.setAttribute('aria-selected', 'true'); }
      b.style.setProperty('--c', g.accent);
      b.onclick = function () { game = g.id; history.replaceState(null, '', '?g=' + game); drawPicker(); load(); };
      p.appendChild(b);
    });
    var cur = p.querySelector('.on'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  document.querySelectorAll('.period button').forEach(function (b) {
    b.onclick = function () { period = b.dataset.p; document.querySelectorAll('.period button').forEach(function (x) { x.classList.toggle('on', x === b); }); load(); };
  });
  function load() {
    var g = info(game), list = document.getElementById('list');
    document.documentElement.style.setProperty('--c', g.accent);
    document.getElementById('gname').textContent = g.name;
    document.getElementById('play').href = '../' + g.id + '/';
    if (!on) { list.innerHTML = '<p class="state">온라인 랭킹을 준비하고 있어요. 조금만 기다려 주세요!</p>'; return; }
    list.innerHTML = '<p class="state">불러오는 중…</p>';
    fetch(C.url.replace(/\/$/, '') + '/rest/v1/rpc/top_scores', {
      method: 'POST', headers: { apikey: C.key, Authorization: 'Bearer ' + C.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_game: game, p_period: period, p_limit: 100 })
    }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (rows) {
      if (!rows.length) { list.innerHTML = '<p class="state">아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</p>'; return; }
      var ol = document.createElement('ol');
      rows.forEach(function (r, i) {
        var li = document.createElement('li'); if (me && r.name === me) li.className = 'me';
        var a = document.createElement('span'); a.className = 'rk'; a.textContent = i + 1;
        var n = document.createElement('span'); n.textContent = r.name;
        var s = document.createElement('span'); s.className = 'sc'; s.textContent = fmt(r.score);
        li.appendChild(a); li.appendChild(n); li.appendChild(s); ol.appendChild(li);
      });
      list.innerHTML = ''; list.appendChild(ol);
    }).catch(function () { list.innerHTML = '<p class="state">랭킹을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>'; });
  }
  drawPicker(); load();
})();
</script>
</body>
</html>
