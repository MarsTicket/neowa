<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>별빛 수호대 - 너와 아케이드</title>
<meta name="description" content="3D 종스크롤 슈팅. 방향키와 스페이스바, 터치 드래그와 자동 발사로 플레이하세요.">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T386KYRRLK"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){window.dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-T386KYRRLK');
</script>
<script src="../assets/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:760px;margin:0 auto;padding:16px}
a{color:#9ec2ff}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0}
.hud{display:flex;gap:16px;font-weight:700;flex-wrap:wrap}
canvas{display:block;width:100%;height:auto;background:#050816;border:1px solid #2f375f;border-radius:12px;touch-action:none}
.controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{background:#3182f6;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;min-height:44px;cursor:pointer}
button.secondary{background:#2a3358}
p{color:#c8cdea;line-height:1.6}
.msg{text-align:center;font-weight:700;min-height:24px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>별빛 수호대</h1>
<a href="../">허브로 돌아가기</a>
</div>
<div class="hud">
<span>점수: <span id="score">0</span></span>
<span>목숨: <span id="lives">3</span></span>
<span>웨이브: <span id="wave">1</span></span>
<span>최고기록: <span id="best">0</span></span>
</div>
<canvas id="game" width="720" height="480"></canvas>
<div class="msg" id="msg">시작 버튼을 누르세요. 방향키 이동, 스페이스바 발사, 터치는 드래그 이동과 자동 발사입니다.</div>
<div class="controls">
<button id="startBtn">게임 시작</button>
<button id="fireBtn">발사</button>
<button id="pauseBtn" class="secondary">일시정지</button>
<button id="restartBtn" class="secondary">다시 시작</button>
<button id="soundBtn" class="secondary">소리 끄기</button>
</div>
<p>적은 위에서 내려옵니다. 적의 탄환이나 적 자체에 닿으면 목숨이 하나 줄고, 적이 아래쪽까지 내려오면 목숨이 하나 줄고 웨이브가 다시 시작됩니다. 모든 적을 없애면 다음 웨이브로 갑니다.</p>
</div>
<script>
"use strict";
var canvas = document.getElementById("game");
var scoreEl = document.getElementById("score");
var livesEl = document.getElementById("lives");
var waveEl = document.getElementById("wave");
var bestEl = document.getElementById("best");
var msgEl = document.getElementById("msg");
var BEST_KEY = "neowa_hub_shooting_high";
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) { best = 0; }
bestEl.textContent = best;
var soundOn = true;
var sounds = {};
["laser", "explosion", "gameover", "powerup", "click"].forEach(function (n) {
  var a = new Audio("../assets/sounds/" + n + ".wav");
  a.preload = "auto";
  if (n === "laser") a.volume = 0.25;
  sounds[n] = a;
});
function playSound(n) {
  if (!soundOn) return;
  try {
    var a = sounds[n];
    if (!a) return;
    a.currentTime = 0;
    a.play().catch(function () {});
  } catch (e) {}
}
document.getElementById("soundBtn").addEventListener("click", function (ev) {
  soundOn = !soundOn;
  ev.target.textContent = soundOn ? "소리 끄기" : "소리 켜기";
});
var shootParticles = [];
var shootParticleGeo = null;
function spawnShootBurst(x, y, color) {
  if (!scene || !shootParticleGeo) return;
  for (var i = 0; i < 14; i++) {
    var m = new THREE.Mesh(shootParticleGeo, new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.9 }));
    var q = to3D(x, y);
    m.position.set(q.x, 0, q.z);
    scene.add(m);
    shootParticles.push({ mesh: m, vx: (Math.random() - 0.5) * 9, vz: (Math.random() - 0.5) * 9, life: 0.6 });
  }
}
function updateShootParticles(dt) {
  for (var i = shootParticles.length - 1; i >= 0; i--) {
    var p = shootParticles[i];
    p.life -= dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.position.y += 0.6 * dt;
    if (p.life <= 0) { scene.remove(p.mesh); shootParticles.splice(i, 1); }
  }
}
if (typeof THREE === "undefined") {
  msgEl.textContent = "3D 엔진 로딩에 실패했습니다. 페이지를 새로고침하세요.";
}
var W = 28, H = 20;
var scene = null, camera = null, renderer = null;
var playerMesh = null, playerEngine = null;
var sharedGeos = {};
function mat(color, emissive, intensity) {
  return new THREE.MeshStandardMaterial({ color: color, emissive: emissive, emissiveIntensity: intensity, roughness: 0.4, metalness: 0.3 });
}
function init3D() {
  if (typeof THREE === "undefined") return false;
  if (renderer) return true;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050816);
  camera = new THREE.PerspectiveCamera(50, 720 / 480, 0.1, 100);
  camera.position.set(0, 22, 14);
  camera.lookAt(0, 0, 0);
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(720, 480, false);
  } catch (e) {
    renderer = null;
    return false;
  }
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  var dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(5, 10, 5);
  scene.add(dir);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(44, 32), new THREE.MeshStandardMaterial({ color: 0x0a0e24, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1;
  scene.add(ground);
  var starGeo = new THREE.BufferGeometry();
  var starPos = [];
  for (var s = 0; s < 400; s++) {
    starPos.push((Math.random() - 0.5) * 40, -0.8, (Math.random() - 0.5) * 30);
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
  var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12 }));
  scene.add(stars);
  sharedGeos.octa = new THREE.OctahedronGeometry(0.7);
  sharedGeos.icosa = new THREE.IcosahedronGeometry(0.9);
  sharedGeos.dodeca = new THREE.DodecahedronGeometry(1.1);
  sharedGeos.bullet = new THREE.BoxGeometry(0.18, 0.18, 0.9);
  shootParticleGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
  sharedGeos.enemyBullet = new THREE.SphereGeometry(0.28, 12, 12);
  playerMesh = new THREE.Group();
  var fuselage = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.8, 4), mat(0x4dd2ff, 0x1a6a8a, 0.6));
  fuselage.rotation.x = -Math.PI / 2;
  playerMesh.add(fuselage);
  var wing = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.15, 0.8), mat(0x2a6a9a, 0x1a4a6a, 0.4));
  wing.position.z = 0.4;
  playerMesh.add(wing);
  var cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), mat(0xffffff, 0x7ee0ff, 0.8));
  cockpit.position.y = 0.4;
  playerMesh.add(cockpit);
  playerEngine = new THREE.Mesh(new THREE.SphereGeometry(0.25, 10, 10), mat(0xaa00ff, 0xaa00ff, 1.2));
  playerEngine.position.z = 0.9;
  playerMesh.add(playerEngine);
  var pl = new THREE.PointLight(0x4dd2ff, 0.8, 8);
  playerMesh.add(pl);
  scene.add(playerMesh);
  return true;
}
function to3D(x, y) { return { x: x - W / 2, z: y - H / 2 }; }
function syncMeshes() {
  if (!renderer) return;
  var p = to3D(player.x, player.y);
  playerMesh.position.set(p.x, 0, p.z);
  playerEngine.scale.setScalar(1 + Math.sin(performance.now() / 100) * 0.2);
  enemies.forEach(function (e) {
    var q = to3D(e.x, e.y);
    e.mesh.position.set(q.x, 0, q.z);
    e.mesh.rotation.y += 0.02;
  });
  bullets.forEach(function (b) {
    var q = to3D(b.x, b.y);
    b.mesh.position.set(q.x, 0, q.z);
  });
  enemyBullets.forEach(function (b) {
    var q = to3D(b.x, b.y);
    b.mesh.position.set(q.x, 0, q.z);
  });
}
function removeMesh(obj) {
  if (obj && obj.mesh && scene) scene.remove(obj.mesh);
}
var state = "ready";
var score = 0, lives = 3, wave = 1;
var player = { x: 14, y: 17, speed: 12, inv: 0 };
var bullets = [], enemyBullets = [], enemies = [];
var keys = {};
var lastTime = 0, fireTimer = 0, enemyTimer = 0, bannerTimer = 0;
var drag = false;
function spawnWave(n) {
  enemies.forEach(removeMesh);
  enemies = [];
  var rows = Math.min(2 + Math.floor(n / 2), 4);
  var cols = Math.min(6 + n, 12);
  var spacing = 2.2;
  var startX = (W - (cols - 1) * spacing) / 2;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var type = r === 0 ? 2 : (r === 1 ? 1 : 0);
      var geo = type === 2 ? sharedGeos.dodeca : (type === 1 ? sharedGeos.icosa : sharedGeos.octa);
      var col = type === 2 ? 0xff5a5a : (type === 1 ? 0xffb020 : 0x4dd2ff);
      var mesh = new THREE.Mesh(geo, mat(col, col, 0.5));
      if (scene) scene.add(mesh);
      enemies.push({
        baseX: startX + c * spacing, baseY: 2 + r * 2,
        x: startX + c * spacing, y: 2 + r * 2,
        phase: c * 0.7 + r, type: type,
        hp: type === 2 ? 3 : (type === 1 ? 2 : 1),
        score: type === 2 ? 250 : (type === 1 ? 150 : 100),
        mesh: mesh
      });
    }
  }
  bannerTimer = 1.5;
}
function resetGame() {
  score = 0; lives = 3; wave = 1;
  player.x = 14; player.y = 17; player.inv = 0;
  bullets.forEach(removeMesh); enemyBullets.forEach(removeMesh);
  bullets = []; enemyBullets = [];
  spawnWave(wave);
  updateHud();
}
function updateHud() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  waveEl.textContent = wave;
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  bestEl.textContent = best;
}
function fire() {
  playSound("laser");
  var mesh = new THREE.Mesh(sharedGeos.bullet, mat(0xffd94d, 0xffd94d, 1.0));
  if (scene) scene.add(mesh);
  bullets.push({ x: player.x, y: player.y - 1, vy: -20, mesh: mesh });
}
function startGame() {
  if (!init3D()) { msgEl.textContent = "3D 엔진 로딩에 실패했습니다. 페이지를 새로고침하세요."; return; }
  resetGame();
  state = "playing";
  msgEl.textContent = "웨이브 " + wave + " 시작!";
  lastTime = performance.now();
  requestAnimationFrame(loop);
}
function loseLife() {
  lives -= 1;
  updateHud();
  enemyBullets.forEach(removeMesh);
  enemyBullets = [];
  player.x = 14; player.y = 17; player.inv = 2;
  if (lives <= 0) {
    state = "over";
    playSound("gameover");
    msgEl.textContent = "게임 오버! 점수 " + score + "점, 최고기록 " + best + "점. 다시 시작 버튼을 누르세요.";
  } else {
    msgEl.textContent = "목숨이 줄었습니다. 남은 목숨 " + lives + "개.";
  }
}
function loop(now) {
  if (state !== "playing") return;
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (bannerTimer > 0) bannerTimer -= dt;
  if (player.inv > 0) player.inv -= dt;
  var dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.a) dx -= 1;
  if (keys.ArrowRight || keys.d) dx += 1;
  if (keys.ArrowUp || keys.w) dy -= 1;
  if (keys.ArrowDown || keys.s) dy += 1;
  if (dx !== 0 || dy !== 0) {
    var len = Math.sqrt(dx * dx + dy * dy);
    player.x += dx / len * player.speed * dt;
    player.y += dy / len * player.speed * dt;
  }
  player.x = Math.max(1, Math.min(W - 1, player.x));
  player.y = Math.max(10, Math.min(H - 1, player.y));
  fireTimer -= dt;
  if (fireTimer <= 0) { fire(); fireTimer = 0.18; }
  for (var i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y += bullets[i].vy * dt;
    if (bullets[i].y < -1) { removeMesh(bullets[i]); bullets.splice(i, 1); }
  }
  var t = now / 1000;
  enemyTimer -= dt;
  if (enemyTimer <= 0) {
    enemyTimer = 1.2;
    enemies.forEach(function (e) {
      if (Math.random() < 0.12) {
        var mesh = new THREE.Mesh(sharedGeos.enemyBullet, mat(0xff5a5a, 0xff5a5a, 1.0));
        if (scene) scene.add(mesh);
        enemyBullets.push({ x: e.x, y: e.y + 1, vy: 7 + wave * 0.5, mesh: mesh });
      }
    });
  }
  for (var j = enemies.length - 1; j >= 0; j--) {
    var e = enemies[j];
    e.baseY += (0.8 + wave * 0.2) * dt;
    e.x = e.baseX + Math.sin(t * 1.2 + e.phase) * 1.2;
    e.y = e.baseY + Math.sin(t * 0.4 + e.phase) * 0.4;
    if (e.y > H - 3) {
      enemies.forEach(removeMesh);
      enemies = [];
      enemyBullets.forEach(removeMesh);
      enemyBullets = [];
      loseLife();
      if (state === "playing") spawnWave(wave);
      break;
    }
  }
  for (var k = enemyBullets.length - 1; k >= 0; k--) {
    enemyBullets[k].y += enemyBullets[k].vy * dt;
    if (enemyBullets[k].y > H + 1) { removeMesh(enemyBullets[k]); enemyBullets.splice(k, 1); }
  }
  for (var b = bullets.length - 1; b >= 0; b--) {
    for (var ei = enemies.length - 1; ei >= 0; ei--) {
      var en = enemies[ei];
      if (Math.abs(bullets[b].x - en.x) < 1.1 && Math.abs(bullets[b].y - en.y) < 1.0) {
        removeMesh(bullets[b]);
        bullets.splice(b, 1);
        en.hp -= 1;
        if (en.hp <= 0) {
          score += en.score;
          spawnShootBurst(en.x, en.y, en.type === 2 ? 0xff5a5a : (en.type === 1 ? 0xffb020 : 0x4dd2ff));
          playSound("explosion");
          removeMesh(en);
          enemies.splice(ei, 1);
        }
        break;
      }
    }
  }
  if (state === "playing" && player.inv <= 0) {
    for (var eb = 0; eb < enemyBullets.length; eb++) {
      if (Math.abs(enemyBullets[eb].x - player.x) < 1.0 && Math.abs(enemyBullets[eb].y - player.y) < 0.9) {
        removeMesh(enemyBullets[eb]);
        enemyBullets.splice(eb, 1);
        loseLife();
        break;
      }
    }
    for (var ec = 0; ec < enemies.length; ec++) {
      if (player.inv > 0) break;
      if (Math.abs(enemies[ec].x - player.x) < 1.2 && Math.abs(enemies[ec].y - player.y) < 1.1) {
        spawnShootBurst(enemies[ec].x, enemies[ec].y, 0xff5a5a);
        playSound("explosion");
        removeMesh(enemies[ec]);
        enemies.splice(ec, 1);
        loseLife();
        break;
      }
    }
  }
  if (state === "playing" && enemies.length === 0) {
    score += 500 + wave * 100;
    wave += 1;
    updateHud();
    playSound("powerup");
    spawnWave(wave);
    msgEl.textContent = "웨이브 " + wave + " 시작!";
  }
  updateHud();
  syncMeshes();
  updateShootParticles(dt);
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("restartBtn").addEventListener("click", startGame);
document.getElementById("fireBtn").addEventListener("click", function () { if (state === "playing") fire(); });
document.getElementById("pauseBtn").addEventListener("click", function () {
  if (state === "playing") { state = "paused"; msgEl.textContent = "일시정지했습니다. 일시정지 버튼을 다시 누르면 이어서 플레이합니다."; }
  else if (state === "paused") { state = "playing"; lastTime = performance.now(); requestAnimationFrame(loop); msgEl.textContent = ""; }
});
window.addEventListener("keydown", function (ev) {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].indexOf(ev.key) >= 0) ev.preventDefault();
  keys[ev.key] = true;
  if (ev.key === "Enter" && (state === "ready" || state === "over")) startGame();
  if (ev.key === "p" || ev.key === "P") document.getElementById("pauseBtn").click();
});
window.addEventListener("keyup", function (ev) { keys[ev.key] = false; });
function canvasPos(ev) {
  var r = canvas.getBoundingClientRect();
  var touch = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
  return { x: (touch.clientX - r.left) / r.width * W, y: (touch.clientY - r.top) / r.height * H };
}
canvas.addEventListener("touchstart", function (ev) {
  ev.preventDefault();
  drag = true;
  var p = canvasPos(ev);
  player.x = Math.max(1, Math.min(W - 1, p.x));
  player.y = Math.max(10, Math.min(H - 1, p.y - 2));
  if (state === "ready") startGame();
}, { passive: false });
canvas.addEventListener("touchmove", function (ev) {
  ev.preventDefault();
  if (!drag) return;
  var p = canvasPos(ev);
  player.x = Math.max(1, Math.min(W - 1, p.x));
  player.y = Math.max(10, Math.min(H - 1, p.y - 2));
}, { passive: false });
canvas.addEventListener("touchend", function () { drag = false; });
if (typeof THREE !== "undefined") {
  if (init3D()) {
    resetGame();
    state = "ready";
    syncMeshes();
    renderer.render(scene, camera);
  } else {
    msgEl.textContent = "WebGL을 사용할 수 없어 3D 게임을 실행할 수 없습니다. 브라우저에서 WebGL을 켜고 페이지를 새로고침하세요.";
    updateHud();
  }
} else {
  updateHud();
}
</script>
</body>
</html>
