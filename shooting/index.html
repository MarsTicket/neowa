<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>별빛 수호대 - 너와 아케이드</title>
<meta name="description" content="종스크롤 슈팅. 방향키와 스페이스바, 터치 드래그와 자동 발사로 플레이하세요.">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T386KYRRLK"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){window.dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-T386KYRRLK');
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:760px;margin:0 auto;padding:16px}
a{color:#9ec2ff}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0}
.hud{display:flex;gap:16px;font-weight:700;flex-wrap:wrap}
canvas{display:block;width:100%;height:auto;background:#050816;border:1px solid #2f375f;border-radius:12px;touch-action:none}
.controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{background:#3182f6;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;min-height:44px;cursor:pointer}
button.secondary{background:#2a3358}
button:disabled{opacity:.5;cursor:default}
p{color:#c8cdea;line-height:1.6}
.msg{text-align:center;font-weight:700;min-height:24px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>별빛 수호대</h1>
<a href="../">허브로 돌아가기</a>
</div>
<div class="hud">
<span>점수: <span id="score">0</span></span>
<span>목숨: <span id="lives">3</span></span>
<span>웨이브: <span id="wave">1</span></span>
<span>최고기록: <span id="best">0</span></span>
</div>
<canvas id="game" width="720" height="480"></canvas>
<div class="msg" id="msg">시작 버튼을 누르세요. 방향키 이동, 스페이스바 발사, 터치는 드래그 이동과 자동 발사입니다.</div>
<div class="controls">
<button id="startBtn">게임 시작</button>
<button id="fireBtn">발사</button>
<button id="pauseBtn" class="secondary">일시정지</button>
<button id="restartBtn" class="secondary">다시 시작</button>
</div>
<p>적은 위에서 내려옵니다. 적의 탄환이나 적 자체에 닿으면 목숨이 하나 줄고, 적이 아래쪽까지 내려오면 목숨이 하나 줄고 웨이브가 다시 시작됩니다. 모든 적을 없애면 다음 웨이브로 갑니다.</p>
</div>
<script>
"use strict";
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var W = 720, H = 480;
var scoreEl = document.getElementById("score");
var livesEl = document.getElementById("lives");
var waveEl = document.getElementById("wave");
var bestEl = document.getElementById("best");
var msgEl = document.getElementById("msg");
var BEST_KEY = "neowa_hub_shooting_high";
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) { best = 0; }
bestEl.textContent = best;

var state = "ready";
var score = 0, lives = 3, wave = 1;
var player = { x: 360, y: 420, w: 36, h: 28, speed: 320, inv: 0 };
var bullets = [], enemyBullets = [], enemies = [];
var keys = {};
var lastTime = 0, fireTimer = 0, enemyTimer = 0, bannerTimer = 0;
var drag = false;

function spawnWave(n) {
  enemies = [];
  var rows = Math.min(2 + Math.floor(n / 2), 4);
  var cols = Math.min(5 + n, 9);
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var type = r === 0 ? 2 : (r === 1 ? 1 : 0);
      enemies.push({
        baseX: 60 + c * 70, baseY: 40 + r * 52,
        x: 60 + c * 70, y: 40 + r * 52,
        phase: c * 0.7 + r, type: type,
        hp: type === 2 ? 3 : (type === 1 ? 2 : 1),
        score: type === 2 ? 250 : (type === 1 ? 150 : 100)
      });
    }
  }
  bannerTimer = 1.5;
}
function resetGame() {
  score = 0; lives = 3; wave = 1;
  player.x = 360; player.y = 420; player.inv = 0;
  bullets = []; enemyBullets = [];
  spawnWave(wave);
  updateHud();
}
function updateHud() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  waveEl.textContent = wave;
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  bestEl.textContent = best;
}
function startGame() {
  resetGame();
  state = "playing";
  msgEl.textContent = "웨이브 " + wave + " 시작!";
  lastTime = performance.now();
  requestAnimationFrame(loop);
}
function loseLife() {
  lives -= 1;
  updateHud();
  enemyBullets = [];
  player.x = 360; player.y = 420; player.inv = 2;
  if (lives <= 0) {
    state = "over";
    msgEl.textContent = "게임 오버! 점수 " + score + "점, 최고기록 " + best + "점. 다시 시작 버튼을 누르세요.";
  } else {
    msgEl.textContent = "목숨이 줄었습니다. 남은 목숨 " + lives + "개.";
  }
}
function fire() {
  bullets.push({ x: player.x, y: player.y - 20, vy: -620 });
}
function loop(now) {
  if (state !== "playing") return;
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (bannerTimer > 0) bannerTimer -= dt;
  if (player.inv > 0) player.inv -= dt;
  var dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.a) dx -= 1;
  if (keys.ArrowRight || keys.d) dx += 1;
  if (keys.ArrowUp || keys.w) dy -= 1;
  if (keys.ArrowDown || keys.s) dy += 1;
  if (dx !== 0 || dy !== 0) {
    var len = Math.sqrt(dx * dx + dy * dy);
    player.x += dx / len * player.speed * dt;
    player.y += dy / len * player.speed * dt;
  }
  player.x = Math.max(20, Math.min(W - 20, player.x));
  player.y = Math.max(200, Math.min(H - 20, player.y));
  fireTimer -= dt;
  if (fireTimer <= 0) { fire(); fireTimer = 0.18; }
  for (var i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y += bullets[i].vy * dt;
    if (bullets[i].y < -10) bullets.splice(i, 1);
  }
  var t = now / 1000;
  enemyTimer -= dt;
  if (enemyTimer <= 0) {
    enemyTimer = 1.2;
    var shooters = enemies.filter(function (e) { return Math.random() < 0.35; });
    shooters.forEach(function (e) {
      enemyBullets.push({ x: e.x, y: e.y + 16, vy: 220 + wave * 15 });
    });
  }
  for (var j = enemies.length - 1; j >= 0; j--) {
    var e = enemies[j];
    e.baseY += (8 + wave * 2) * dt;
    e.x = e.baseX + Math.sin(t * 1.2 + e.phase) * 24;
    e.y = e.baseY + Math.sin(t * 0.4 + e.phase) * 8;
    if (e.y > H - 60) {
      enemies = [];
      enemyBullets = [];
      loseLife();
      if (state === "playing") spawnWave(wave);
      break;
    }
  }
  for (var k = enemyBullets.length - 1; k >= 0; k--) {
    enemyBullets[k].y += enemyBullets[k].vy * dt;
    if (enemyBullets[k].y > H + 10) enemyBullets.splice(k, 1);
  }
  for (var b = bullets.length - 1; b >= 0; b--) {
    for (var ei = enemies.length - 1; ei >= 0; ei--) {
      var en = enemies[ei];
      if (Math.abs(bullets[b].x - en.x) < 22 && Math.abs(bullets[b].y - en.y) < 20) {
        bullets.splice(b, 1);
        en.hp -= 1;
        if (en.hp <= 0) {
          score += en.score;
          enemies.splice(ei, 1);
        }
        break;
      }
    }
  }
  if (state === "playing" && player.inv <= 0) {
    for (var eb = 0; eb < enemyBullets.length; eb++) {
      if (Math.abs(enemyBullets[eb].x - player.x) < 20 && Math.abs(enemyBullets[eb].y - player.y) < 18) {
        enemyBullets.splice(eb, 1);
        loseLife();
        break;
      }
    }
    for (var ec = 0; ec < enemies.length; ec++) {
      if (player.inv > 0) break;
      if (Math.abs(enemies[ec].x - player.x) < 24 && Math.abs(enemies[ec].y - player.y) < 22) {
        loseLife();
        break;
      }
    }
  }
  if (state === "playing" && enemies.length === 0) {
    score += 500 + wave * 100;
    wave += 1;
    updateHud();
    spawnWave(wave);
    msgEl.textContent = "웨이브 " + wave + " 시작!";
  }
  updateHud();
  draw();
  requestAnimationFrame(loop);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#050816";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#223";
  for (var s = 0; s < 40; s++) {
    var sx = (s * 173) % W, sy = (s * 97) % H;
    ctx.fillRect(sx, sy, 2, 2);
  }
  enemies.forEach(function (e) {
    ctx.fillStyle = e.type === 2 ? "#ff5a5a" : (e.type === 1 ? "#ffb020" : "#4dd2ff");
    ctx.beginPath();
    if (e.type === 2) {
      ctx.moveTo(e.x, e.y - 16); ctx.lineTo(e.x + 16, e.y + 12); ctx.lineTo(e.x, e.y + 4); ctx.lineTo(e.x - 16, e.y + 12); ctx.closePath();
    } else if (e.type === 1) {
      ctx.arc(e.x, e.y, 14, 0, Math.PI * 2);
    } else {
      ctx.rect(e.x - 14, e.y - 12, 28, 24);
    }
    ctx.fill();
    ctx.fillStyle = "#0b1020";
    ctx.beginPath(); ctx.arc(e.x, e.y, 4, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = "#ffd94d";
  enemyBullets.forEach(function (b) { ctx.fillRect(b.x - 3, b.y - 6, 6, 12); });
  ctx.fillStyle = "#7ee0ff";
  bullets.forEach(function (b) { ctx.fillRect(b.x - 3, b.y - 10, 6, 20); });
  if (player.inv <= 0 || Math.floor(performance.now() / 200) % 2 === 0) {
    ctx.fillStyle = "#4dd2ff";
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - 18);
    ctx.lineTo(player.x + 18, player.y + 14);
    ctx.lineTo(player.x, player.y + 6);
    ctx.lineTo(player.x - 18, player.y + 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(player.x, player.y, 5, 0, Math.PI * 2); ctx.fill();
  }
  if (bannerTimer > 0) {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 28px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("웨이브 " + wave, W / 2, H / 2);
    ctx.textAlign = "left";
  }
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("fireBtn").addEventListener("click", function () { if (state === "playing") fire(); });
document.getElementById("restartBtn").addEventListener("click", startGame);
document.getElementById("pauseBtn").addEventListener("click", function () {
  if (state === "playing") { state = "paused"; msgEl.textContent = "일시정지했습니다. 일시정지 버튼을 다시 누르면 이어서 플레이합니다."; }
  else if (state === "paused") { state = "playing"; lastTime = performance.now(); requestAnimationFrame(loop); msgEl.textContent = ""; }
});
window.addEventListener("keydown", function (ev) {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].indexOf(ev.key) >= 0) ev.preventDefault();
  keys[ev.key] = true;
  if (ev.key === "Enter" && (state === "ready" || state === "over")) startGame();
  if (ev.key === "p" || ev.key === "P") document.getElementById("pauseBtn").click();
});
window.addEventListener("keyup", function (ev) { keys[ev.key] = false; });
function canvasPos(ev) {
  var r = canvas.getBoundingClientRect();
  var touch = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
  return { x: (touch.clientX - r.left) * (W / r.width), y: (touch.clientY - r.top) * (H / r.height) };
}
canvas.addEventListener("touchstart", function (ev) {
  ev.preventDefault();
  drag = true;
  var p = canvasPos(ev);
  player.x = Math.max(20, Math.min(W - 20, p.x));
  player.y = Math.max(200, Math.min(H - 20, p.y - 50));
  if (state === "ready") startGame();
}, { passive: false });
canvas.addEventListener("touchmove", function (ev) {
  ev.preventDefault();
  if (!drag) return;
  var p = canvasPos(ev);
  player.x = Math.max(20, Math.min(W - 20, p.x));
  player.y = Math.max(200, Math.min(H - 20, p.y - 50));
}, { passive: false });
canvas.addEventListener("touchend", function () { drag = false; });
canvas.addEventListener("mousedown", function (ev) {
  drag = true;
  var p = canvasPos(ev);
  player.x = Math.max(20, Math.min(W - 20, p.x));
});
window.addEventListener("mousemove", function (ev) {
  if (!drag) return;
  var p = canvasPos(ev);
  player.x = Math.max(20, Math.min(W - 20, p.x));
  player.y = Math.max(200, Math.min(H - 20, p.y));
});
window.addEventListener("mouseup", function () { drag = false; });
resetGame();
state = "ready";
draw();
</script>
</body>
</html>
