<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>스네이크 - 너와 아케이드</title>
<meta name="description" content="스네이크. 방향키, 스와이프, 화면 방향 버튼으로 플레이하세요.">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T386KYRRLK"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){window.dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-T386KYRRLK');
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:920px;margin:0 auto;padding:16px}
a{color:#9ec2ff}
h1{font-size:24px;margin:0 0 8px}
.hud{display:flex;gap:16px;font-weight:700;flex-wrap:wrap;margin-bottom:12px}
.layout{display:flex;gap:16px;align-items:flex-start}
@media(max-width:720px){.layout{flex-direction:column}}
canvas{display:block;width:100%;max-width:520px;height:auto;background:#07130a;border:1px solid #2f375f;border-radius:12px;touch-action:none}
.side{flex:1;min-width:200px}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:12px 0}
.pad button{width:64px;height:64px;font-size:22px}
button{background:#3182f6;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;min-height:44px;cursor:pointer}
button.secondary{background:#2a3358}
.controls{display:flex;gap:10px;flex-wrap:wrap}
p{color:#c8cdea;line-height:1.6}
.msg{font-weight:700;min-height:24px}
</style>
</head>
<body>
<div class="wrap">
<h1>스네이크</h1>
<p><a href="../">허브로 돌아가기</a></p>
<div class="hud">
<span>점수: <span id="score">0</span></span>
<span>속도 단계: <span id="speed">1</span></span>
<span>최고기록: <span id="best">0</span></span>
</div>
<div class="layout">
<canvas id="game" width="600" height="600"></canvas>
<div class="side">
<div class="msg" id="msg">시작 버튼을 누르세요. 방향키, 스와이프, 아래 방향 버튼으로 움직입니다.</div>
<div class="pad">
<span></span><button data-dir="up" aria-label="위">▲</button><span></span>
<button data-dir="left" aria-label="왼쪽">◀</button><span></span><button data-dir="right" aria-label="오른쪽">▶</button>
<span></span><button data-dir="down" aria-label="아래">▼</button><span></span>
</div>
<div class="controls">
<button id="startBtn">게임 시작</button>
<button id="pauseBtn" class="secondary">일시정지</button>
</div>
<p>먹이를 먹으면 점수가 오르고 속도 단계가 올라갑니다. 벽이나 자기 몸에 부딪히면 게임이 끝납니다. 방향을 바로 뒤로 꺾을 수는 없습니다.</p>
</div>
</div>
</div>
<script>
"use strict";
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var COLS = 20, ROWS = 20, CELL = 30;
var scoreEl = document.getElementById("score");
var speedEl = document.getElementById("speed");
var bestEl = document.getElementById("best");
var msgEl = document.getElementById("msg");
var BEST_KEY = "neowa_hub_snake_high";
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) { best = 0; }
bestEl.textContent = best;
var state = "ready";
var snake = [], dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 }, food = null, score = 0, timer = null;
function speedMs() { return Math.max(70, 160 - Math.floor(score / 10) * 10); }
function speedLevel() { return 1 + Math.floor(score / 10); }
function placeFood() {
  while (true) {
    var f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    var onSnake = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
    if (!onSnake) { food = f; return; }
  }
}
function resetGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
  score = 0;
  placeFood();
  updateHud();
  draw();
}
function updateHud() {
  scoreEl.textContent = score;
  speedEl.textContent = speedLevel();
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  bestEl.textContent = best;
}
function step() {
  if (state !== "playing") return;
  dir = nextDir;
  var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
    gameOver();
    return;
  }
  snake.unshift(head);
  if (food && head.x === food.x && head.y === food.y) {
    score += 10;
    placeFood();
  } else {
    snake.pop();
  }
  updateHud();
  draw();
  clearInterval(timer);
  timer = setInterval(step, speedMs());
}
function startGame() {
  resetGame();
  state = "playing";
  msgEl.textContent = "플레이 중입니다.";
  clearInterval(timer);
  timer = setInterval(step, speedMs());
}
function gameOver() {
  state = "over";
  clearInterval(timer);
  msgEl.textContent = "게임 오버! 점수 " + score + "점, 최고기록 " + best + "점. 시작 버튼을 눌러 다시 플레이하세요.";
  draw();
}
function setDir(x, y) {
  if (state !== "playing") return;
  if (x === -nextDir.x && y === -nextDir.y) return;
  if (x === nextDir.x && y === nextDir.y) return;
  nextDir = { x: x, y: y };
}
function draw() {
  ctx.clearRect(0, 0, 600, 600);
  ctx.fillStyle = "#07130a";
  ctx.fillRect(0, 0, 600, 600);
  ctx.strokeStyle = "#12281a";
  for (var i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 600); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(600, i * CELL); ctx.stroke();
  }
  if (food) {
    ctx.fillStyle = "#ff5a5a";
    ctx.beginPath(); ctx.arc(food.x * CELL + 15, food.y * CELL + 15, 11, 0, Math.PI * 2); ctx.fill();
  }
  snake.forEach(function (s, idx) {
    ctx.fillStyle = idx === 0 ? "#7ee787" : "#2f9e44";
    ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
  });
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("pauseBtn").addEventListener("click", function () {
  if (state === "playing") { state = "paused"; clearInterval(timer); msgEl.textContent = "일시정지했습니다. 일시정지 버튼을 다시 누르면 이어서 플레이합니다."; }
  else if (state === "paused") { state = "playing"; timer = setInterval(step, speedMs()); msgEl.textContent = "플레이 중입니다."; }
});
document.querySelectorAll(".pad button").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var d = btn.getAttribute("data-dir");
    if (d === "up") setDir(0, -1);
    if (d === "down") setDir(0, 1);
    if (d === "left") setDir(-1, 0);
    if (d === "right") setDir(1, 0);
  });
});
window.addEventListener("keydown", function (ev) {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].indexOf(ev.key) >= 0) ev.preventDefault();
  if (ev.key === "ArrowUp" || ev.key === "w") setDir(0, -1);
  if (ev.key === "ArrowDown" || ev.key === "s") setDir(0, 1);
  if (ev.key === "ArrowLeft" || ev.key === "a") setDir(-1, 0);
  if (ev.key === "ArrowRight" || ev.key === "d") setDir(1, 0);
  if (ev.key === "Enter" && (state === "ready" || state === "over")) startGame();
});
var touchX = null, touchY = null;
canvas.addEventListener("touchstart", function (ev) {
  var t = ev.touches[0];
  touchX = t.clientX; touchY = t.clientY;
  if (state === "ready") startGame();
}, { passive: true });
canvas.addEventListener("touchend", function (ev) {
  if (touchX === null) return;
  var t = ev.changedTouches[0];
  var dx = t.clientX - touchX, dy = t.clientY - touchY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
  touchX = null; touchY = null;
});
resetGame();
state = "ready";
</script>
</body>
</html>
