<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>스네이크 - 너와 아케이드</title>
<meta name="description" content="3D 스네이크. 방향키, 스와이프, 화면 방향 버튼으로 플레이하세요.">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T386KYRRLK"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){window.dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-T386KYRRLK');
</script>
<script src="../assets/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0c14;color:#f2f3f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:920px;margin:0 auto;padding:20px 24px 40px}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 16px;border-bottom:1px solid #232744;margin-bottom:16px}
.top h1{font-size:28px;margin:0;letter-spacing:-0.5px}
.top .eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:#7ee787;margin:0 0 4px}
.back{display:inline-block;padding:10px 16px;border:1px solid #3a4066;border-radius:999px;font-size:14px;font-weight:700;min-height:44px;line-height:22px;color:#c8cdea}
.hud{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#161a30;border:1px solid #2a2f52;border-radius:14px;padding:10px 14px}
.stat .label{display:block;font-size:12px;color:#9aa1c2;margin-bottom:2px}
.stat .value{font-size:22px;font-weight:900;line-height:1.2}
.stat.score .value{font-size:28px;color:#7ee787}
.layout{display:flex;gap:20px;align-items:flex-start}
@media(max-width:720px){.layout{flex-direction:column}}
canvas{display:block;width:100%;max-width:520px;height:auto;background:#07130a;border:1px solid #2a2f52;border-radius:20px;touch-action:none;box-shadow:0 20px 50px rgba(0,0,0,0.45)}
.side{flex:1;min-width:220px}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:16px 0}
.pad button{width:64px;height:64px;font-size:22px;background:#161a30;border:1px solid #3a4066;color:#f2f3f7}
button{border:0;border-radius:999px;padding:13px 22px;font-size:15px;font-weight:800;min-height:48px;cursor:pointer}
button.primary{background:#fff;color:#0a0c14}
button.secondary{background:transparent;color:#f2f3f7;border:1px solid #3a4066}
.controls{display:flex;gap:10px;flex-wrap:wrap}
p{color:#9aa1c2;line-height:1.6;font-size:14px}
.msg{font-weight:800;min-height:24px;color:#c8cdea}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div>
<p class="eyebrow">SNAKE</p>
<h1>스네이크</h1>
</div>
<a class="back" href="../">허브로 돌아가기</a>
</div>
<div class="hud">
<div class="stat score"><span class="label">점수</span><span class="value" id="score">0</span></div>
<div class="stat"><span class="label">속도 단계</span><span class="value" id="speed">1</span></div>
<div class="stat"><span class="label">최고기록</span><span class="value" id="best">0</span></div>
</div>
<div class="layout">
<canvas id="game" width="600" height="600"></canvas>
<div class="side">
<div class="msg" id="msg">시작 버튼을 누르세요. 방향키, 스와이프, 아래 방향 버튼으로 움직입니다.</div>
<div class="pad">
<span></span><button data-dir="up" aria-label="위">▲</button><span></span>
<button data-dir="left" aria-label="왼쪽">◀</button><span></span><button data-dir="right" aria-label="오른쪽">▶</button>
<span></span><button data-dir="down" aria-label="아래">▼</button><span></span>
</div>
<div class="controls">
<button id="startBtn" class="primary">게임 시작</button>
<button id="pauseBtn" class="secondary">일시정지</button>
<button id="soundBtn" class="secondary">소리 끄기</button>
</div>
<p>먹이를 먹을수록 빨라집니다. 벽에 닿으면 반대쪽에서 이어집니다. 자기 몸에 부딪히면 게임이 끝납니다.</p>
</div>
</div>
</div>
<script>
"use strict";
var canvas = document.getElementById("game");
var scoreEl = document.getElementById("score");
var speedEl = document.getElementById("speed");
var bestEl = document.getElementById("best");
var msgEl = document.getElementById("msg");
var BEST_KEY = "neowa_hub_snake_high";
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) { best = 0; }
bestEl.textContent = best;
var soundOn = true;
var sounds = {};
["coin", "gameover", "click"].forEach(function (n) {
  var a = new Audio("../assets/sounds/" + n + ".wav");
  a.preload = "auto";
  sounds[n] = a;
});
function playSound(n) {
  if (!soundOn) return;
  try {
    var a = sounds[n];
    if (!a) return;
    a.currentTime = 0;
    a.play().catch(function () {});
  } catch (e) {}
}
document.getElementById("soundBtn").addEventListener("click", function (ev) {
  soundOn = !soundOn;
  ev.target.textContent = soundOn ? "소리 끄기" : "소리 켜기";
});
if (typeof THREE === "undefined") {
  msgEl.textContent = "3D 엔진 로딩에 실패했습니다. 페이지를 새로고침하세요.";
}
var COLS = 20, ROWS = 20;
var scene = null, camera = null, renderer = null;
var snakeGroup = null, foodMesh = null, flashMesh = null;
var flashUntil = 0, flashX = 0, flashY = 0;
var bodyGeo = null, headGeo = null, foodGeo = null;
function init3D() {
  if (typeof THREE === "undefined") return false;
  if (renderer) return true;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07130a);
  camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.set(0, 20, 14);
  camera.lookAt(0, 0, 0);
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(600, 600, false);
  } catch (e) {
    renderer = null;
    return false;
  }
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  var dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(5, 10, 5);
  scene.add(dir);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), new THREE.MeshStandardMaterial({ color: 0x0a1a10, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.6;
  scene.add(ground);
  var grid = new THREE.GridHelper(20, 20, 0x2a4a3a, 0x1a2a22);
  grid.position.y = -0.5;
  scene.add(grid);
  bodyGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
  headGeo = new THREE.BoxGeometry(1.0, 1.0, 1.0);
  foodGeo = new THREE.SphereGeometry(0.55, 16, 16);
  snakeGroup = new THREE.Group();
  scene.add(snakeGroup);
  foodMesh = new THREE.Mesh(foodGeo, new THREE.MeshStandardMaterial({ color: 0xff5a5a, emissive: 0xff2222, emissiveIntensity: 0.7, roughness: 0.3 }));
  scene.add(foodMesh);
  flashMesh = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffff99, emissive: 0xffff66, emissiveIntensity: 1.2, transparent: true, opacity: 0.9 }));
  flashMesh.visible = false;
  scene.add(flashMesh);
  return true;
}
function draw() {
  if (!renderer) return;
  while (snakeGroup.children.length > 0) snakeGroup.remove(snakeGroup.children[0]);
  snake.forEach(function (s, idx) {
    var m = new THREE.Mesh(idx === 0 ? headGeo : bodyGeo, new THREE.MeshStandardMaterial({ color: idx === 0 ? 0x7ee787 : 0x2f9e44, emissive: idx === 0 ? 0x2a5a2a : 0x0a2a12, emissiveIntensity: 0.4, roughness: 0.4 }));
    m.position.set(s.x - 10 + 0.5, 0, s.y - 10 + 0.5);
    snakeGroup.add(m);
  });
  if (food) foodMesh.position.set(food.x - 10 + 0.5, 0, food.y - 10 + 0.5);
  if (flashMesh) {
    flashMesh.visible = Date.now() < flashUntil;
    if (flashMesh.visible) flashMesh.position.set(flashX - 10 + 0.5, 0, flashY - 10 + 0.5);
  }
  renderer.render(scene, camera);
}
var state = "ready";
var snake = [], dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 }, food = null, score = 0, timer = null;
function speedMs() { return Math.max(70, 160 - Math.floor(score / 10) * 10); }
function speedLevel() { return 1 + Math.floor(score / 10); }
function placeFood() {
  while (true) {
    var f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    var onSnake = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
    if (!onSnake) { food = f; return; }
  }
}
function resetGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
  score = 0;
  placeFood();
  updateHud();
  draw();
}
function updateHud() {
  scoreEl.textContent = score;
  speedEl.textContent = speedLevel();
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  bestEl.textContent = best;
}
function step() {
  if (state !== "playing") return;
  dir = nextDir;
  var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0) head.x = COLS - 1;
  if (head.x >= COLS) head.x = 0;
  if (head.y < 0) head.y = ROWS - 1;
  if (head.y >= ROWS) head.y = 0;
  if (snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
    gameOver();
    return;
  }
  snake.unshift(head);
  if (food && head.x === food.x && head.y === food.y) {
    score += 10;
    playSound("coin");
    flashX = food.x; flashY = food.y; flashUntil = Date.now() + 300;
    placeFood();
  } else {
    snake.pop();
  }
  updateHud();
  draw();
  clearInterval(timer);
  timer = setInterval(step, speedMs());
}
function startGame() {
  if (!init3D()) { msgEl.textContent = "3D 엔진 로딩에 실패했습니다. 페이지를 새로고침하세요."; return; }
  playSound("click");
  resetGame();
  state = "playing";
  msgEl.textContent = "플레이 중입니다.";
  clearInterval(timer);
  timer = setInterval(step, speedMs());
}
function gameOver() {
  state = "over";
  clearInterval(timer);
  playSound("gameover");
  msgEl.textContent = "게임 오버! 점수 " + score + "점, 최고기록 " + best + "점. 시작 버튼을 눌러 다시 플레이하세요.";
  draw();
}
function setDir(x, y) {
  if (state !== "playing") return;
  if (x === -dir.x && y === -dir.y) return;
  if (x === dir.x && y === dir.y) return;
  nextDir = { x: x, y: y };
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("pauseBtn").addEventListener("click", function () {
  if (state === "playing") { state = "paused"; clearInterval(timer); msgEl.textContent = "일시정지했습니다. 일시정지 버튼을 다시 누르면 이어서 플레이합니다."; }
  else if (state === "paused") { state = "playing"; timer = setInterval(step, speedMs()); msgEl.textContent = "플레이 중입니다."; }
});
document.querySelectorAll(".pad button").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var d = btn.getAttribute("data-dir");
    if (d === "up") setDir(0, -1);
    if (d === "down") setDir(0, 1);
    if (d === "left") setDir(-1, 0);
    if (d === "right") setDir(1, 0);
  });
});
window.addEventListener("keydown", function (ev) {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].indexOf(ev.key) >= 0) ev.preventDefault();
  if (ev.key === "ArrowUp" || ev.key === "w") setDir(0, -1);
  if (ev.key === "ArrowDown" || ev.key === "s") setDir(0, 1);
  if (ev.key === "ArrowLeft" || ev.key === "a") setDir(-1, 0);
  if (ev.key === "ArrowRight" || ev.key === "d") setDir(1, 0);
  if (ev.key === "Enter" && (state === "ready" || state === "over")) startGame();
});
var touchX = null, touchY = null;
canvas.addEventListener("touchstart", function (ev) {
  var t = ev.touches[0];
  touchX = t.clientX; touchY = t.clientY;
  if (state === "ready") startGame();
}, { passive: true });
canvas.addEventListener("touchend", function (ev) {
  if (touchX === null) return;
  var t = ev.changedTouches[0];
  var dx = t.clientX - touchX, dy = t.clientY - touchY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
  touchX = null; touchY = null;
});
if (typeof THREE !== "undefined") {
  if (init3D()) {
    resetGame();
    state = "ready";
  } else {
    msgEl.textContent = "WebGL을 사용할 수 없어 3D 게임을 실행할 수 없습니다. 브라우저에서 WebGL을 켜고 페이지를 새로고침하세요.";
    updateHud();
  }
} else {
  updateHud();
}
</script>
</body>
</html>
